  required_checkpoints:
  - planner model_best.ckpt named by the README; not downloaded
  estimated_run_cost: unmeasured; environment.yml pins Python 3.10.14 and PyTorch
    2.4.0
  implementation_status: BLOCKED
  selects: not_a_selector
  reason: README names libero_butter, libero_book, libero_chocolate, and libero_microwave,
    plus three ManiSkill tasks that are outside v0. The backbone is not image CNN
    Diffusion Policy. Entrypoints were not executed.
