  estimated_run_cost: unmeasured; README pins Python 3.10, TensorFlow 2.14.0, JAX
    0.4.20, CUDA 11.8
  implementation_status: BLOCKED
  selects: episode
  reason: DataMIL's LIBERO path trains Octo. That is not swapped into the image Diffusion
    Policy leaderboard. MetaWorld is outside this phase.
