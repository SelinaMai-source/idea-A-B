[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-a-b"
version = "0.1.0"
description = "Idea A/B smoke-test research framework: synthetic identification and observability experiments, lightweight official baselines, and JSON-driven reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pandas",
  "pyyaml",
  "matplotlib",
  "pytest",
  "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["idea_A*", "idea_B*", "shared*"]
exclude = ["shared.tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["shared/tests", "idea_A/tests", "idea_B/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
