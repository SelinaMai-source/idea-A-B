idea: Feedback-Induced Observability Collapse
method: ObservabilityController
method_label: Observability controller v1.0
generic_control: false
official_reproduction: false
seed: 1
budget: 0.1
horizon: 32
ridge_lambda: 0.5
smoothing: 0.6
mix_uniform: 0.1
sgd_learning_rate: 0.15
lazy_period: 5
freeze_theta: false
freeze_sampling: false
